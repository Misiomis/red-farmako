<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Panel de productos · Red Farmako</title>
  <!-- Panel interno: no indexar en buscadores -->
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#1e2925" />
  <link rel="icon" type="image/png" href="img/web/isotipo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@700&family=Plus+Jakarta+Sans:wght@300;400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="admin-page">

  <header class="admin-top" id="adminTop" hidden>
    <img data-asset="logoHorizontal" alt="Red Farmako" class="admin-top__logo" />
    <span class="admin-scope" id="adminScope"></span>
    <div class="admin-top__actions">
      <a class="btn btn--ghost btn--sm" href="./" target="_blank" rel="noopener">Ver tienda ↗</a>
      <button class="btn btn--ghost btn--sm" id="adminLogout">Salir</button>
    </div>
  </header>

  <main class="admin admin--page" id="adminBody"></main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="core.js"></script>
  <script src="admin.js"></script>
</body>
</html>
